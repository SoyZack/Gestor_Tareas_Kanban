<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TaskFlow: gestor de tareas Kanban sencillo y minimalista.">
    <title>TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!--ENCABEZADO-->
    <header class="bg-white border-bottom">
        <nav class="container py-3 d-flex justify-content-between align-items-center">

            <a
                href="#"
                class="d-flex align-items-center gap-3 text-decoration-none text-dark"
            >
                <div class="logo">
                    <i class="bi bi-kanban"></i>
                </div>

                <div>
                    <h1 class="h4 fw-bold mb-0">TaskFlow</h1>
                    <p class="small text-secondary mb-0">
                        Gestor de tareas
                    </p>
                </div>
            </a>

            <button
                type="button"
                class="btn btn-primary"
                data-bs-toggle="collapse"
                data-bs-target="#formulario-collapse"
                aria-expanded="false"
                aria-controls="formulario-collapse"
            >
                <i class="bi bi-plus-lg me-1"></i>
                <span class="d-none d-sm-inline">Nueva tarea</span>
                <span class="d-inline d-sm-none">Agregar</span>
            </button>

        </nav>
    </header>


    <!--CONTENIDO PRINCIPAL-->
    <main class="container py-4 py-md-5">

        <!-- Título del tablero -->
        <section class="mb-4">
            <h2 class="h3 fw-bold">Mi tablero</h2>

            <p class="text-secondary mb-0">
                Organiza tus tareas y lleva el control de tu progreso.
            </p>
        </section>


        <!-- FORMULARIO DE TAREAS-->
        <section
            id="formulario-collapse"
            class="collapse mb-4"
        >
            <div class="card border-0 shadow-sm">
                <div class="card-body p-3 p-md-4">

                    <h3 class="h5 fw-bold mb-4">
                        <i class="bi bi-plus-circle me-2"></i>
                        Crear nueva tarea
                    </h3>

                    <form id="form-tarea">

                        <div class="row g-3">

                            <!-- Título -->
                            <div class="col-12">
                                <label
                                    for="titulo"
                                    class="form-label"
                                >
                                    Título de la tarea
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="titulo"
                                    name="titulo"
                                    placeholder="Ej. Crear una página web"
                                    maxlength="100"
                                    required
                                >
                            </div>


                            <!-- Descripción -->
                            <div class="col-12">
                                <label
                                    for="descripcion"
                                    class="form-label"
                                >
                                    Descripción
                                </label>

                                <textarea
                                    class="form-control"
                                    id="descripcion"
                                    name="descripcion"
                                    rows="3"
                                    placeholder="Describe brevemente la tarea..."
                                ></textarea>
                            </div>


                            <!-- Prioridad -->
                            <div class="col-12 col-md-6">
                                <label
                                    for="prioridad"
                                    class="form-label"
                                >
                                    Prioridad
                                </label>

                                <select
                                    class="form-select"
                                    id="prioridad"
                                    name="prioridad"
                                >
                                    <option value="baja">
                                        Baja
                                    </option>

                                    <option value="media" selected>
                                        Media
                                    </option>

                                    <option value="alta">
                                        Alta
                                    </option>
                                </select>
                            </div>


                            <!-- Fecha límite -->
                            <div class="col-12 col-md-6">
                                <label
                                    for="fechaLimite"
                                    class="form-label"
                                >
                                    Fecha límite
                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="fechaLimite"
                                    name="fechaLimite"
                                >
                            </div>


                            <!-- Botones -->
                            <div class="col-12 d-flex justify-content-end gap-2">

                                <button
                                    type="button"
                                    class="btn btn-light border"
                                    data-bs-toggle="collapse"
                                    data-bs-target="#formulario-collapse"
                                >
                                    Cancelar
                                </button>

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    <i class="bi bi-plus-lg me-1"></i>
                                    Crear tarea
                                </button>

                            </div>

                        </div>

                    </form>

                </div>
            </div>
        </section>


        <!--BUSCADOR Y FILTROS -->
        <section class="card border-0 shadow-sm mb-4">

            <div class="card-body p-3">

                <div class="row g-3">

                    <!-- Buscador -->
                    <div class="col-12 col-lg-5">

                        <label
                            for="busqueda"
                            class="form-label small fw-semibold"
                        >
                            Buscar tareas
                        </label>

                        <div class="input-group">

                            <span class="input-group-text bg-white">
                                <i class="bi bi-search"></i>
                            </span>

                            <input
                                type="search"
                                class="form-control"
                                id="busqueda"
                                placeholder="Buscar por título..."
                            >

                        </div>
                    </div>


                    <!-- Filtro de prioridad -->
                    <div class="col-6 col-lg-3">

                        <label
                            for="filtro-prioridad"
                            class="form-label small fw-semibold"
                        >
                            Prioridad
                        </label>

                        <select
                            id="filtro-prioridad"
                            class="form-select"
                        >
                            <option value="todas">
                                Todas
                            </option>

                            <option value="alta">
                                Alta
                            </option>

                            <option value="media">
                                Media
                            </option>

                            <option value="baja">
                                Baja
                            </option>
                        </select>

                    </div>


                    <!-- Filtro de estado -->
                    <div class="col-6 col-lg-4">

                        <label
                            for="filtro-estado"
                            class="form-label small fw-semibold"
                        >
                            Estado
                        </label>

                        <select
                            id="filtro-estado"
                            class="form-select"
                        >
                            <option value="todos">
                                Todos los estados
                            </option>

                            <option value="pendiente">
                                Por hacer
                            </option>

                            <option value="progreso">
                                En progreso
                            </option>

                            <option value="completada">
                                Completadas
                            </option>
                        </select>

                    </div>

                </div>

            </div>

        </section>


        <!--TABLERO KANBAN -->
        <section id="tablero">

            <div class="row g-3 g-lg-4">


                <!-- COLUMNA: POR HACER -->
                <div class="col-12 col-md-4">

                    <div class="kanban-columna h-100">

                        <div
                            class="d-flex align-items-center justify-content-between mb-3"
                        >
                            <h3 class="h6 fw-bold mb-0">

                                <span
                                    class="estado-punto punto-pendiente"
                                ></span>

                                Por hacer

                            </h3>

                            <span
                                id="contador-pendiente"
                                class="badge text-bg-light border"
                            >
                                0
                            </span>
                        </div>

                        <div
                            id="columna-pendiente"
                            class="lista-tareas"
                        >
                        </div>

                    </div>

                </div>


                <!-- COLUMNA: EN PROGRESO -->
                <div class="col-12 col-md-4">

                    <div class="kanban-columna h-100">

                        <div
                            class="d-flex align-items-center justify-content-between mb-3"
                        >
                            <h3 class="h6 fw-bold mb-0">

                                <span
                                    class="estado-punto punto-progreso"
                                ></span>

                                En progreso

                            </h3>

                            <span
                                id="contador-progreso"
                                class="badge text-bg-light border"
                            >
                                0
                            </span>
                        </div>

                        <div
                            id="columna-progreso"
                            class="lista-tareas"
                        >
                        </div>

                    </div>

                </div>


                <!-- COLUMNA: COMPLETADAS -->
                <div class="col-12 col-md-4">

                    <div class="kanban-columna h-100">

                        <div
                            class="d-flex align-items-center justify-content-between mb-3"
                        >
                            <h3 class="h6 fw-bold mb-0">

                                <span
                                    class="estado-punto punto-completada"
                                ></span>

                                Completadas

                            </h3>

                            <span
                                id="contador-completada"
                                class="badge text-bg-light border"
                            >
                                0
                            </span>
                        </div>

                        <div
                            id="columna-completada"
                            class="lista-tareas"
                        >
                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!--PIE DE PÁGINA -->
        <footer class="text-center text-secondary small mt-5">
            <p class="mb-0">
                TaskFlow · Gestor de tareas Kanban
            </p>
        </footer>

    </main>


    <!-- Bootstrap JavaScript: para el formulario desplegable -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- JavaScript propio con módulos ES -->
    <script
        type="module"
        src="js/main.js"
    ></script>

</body>

</html>
